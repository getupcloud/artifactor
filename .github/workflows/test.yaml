name: test

# Runs the checks that keep main green — formatting (gofmt), go vet and the
# unit tests with the race detector — on every pull request and on every push
# to main, so a change that breaks a test or the formatting cannot be merged
# unnoticed. The vet and test steps call the Makefile targets, so CI and a
# local `make vet test` always run the same commands.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # The integration tests are behind the `integration` build tag, so the
      # plain `go test ./...` below needs neither network nor the grype DB.
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: make vet

      - name: test
        run: make test
