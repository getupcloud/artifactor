# imagePullSecret referenced by the Deployment (e.g. to pull the artifactor
# image from a private registry). Created only when imagePullSecret.create
# is true.
{{- if .Values.imagePullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artifactor.fullname" . }}-image-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "artifactor.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecret.dockerconfigjson | b64enc | quote }}
{{- end }}
