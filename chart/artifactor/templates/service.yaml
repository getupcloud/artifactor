apiVersion: v1
kind: Service
metadata:
  name: {{ include "artifactor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "artifactor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "artifactor.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
