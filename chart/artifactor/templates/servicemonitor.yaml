{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "artifactor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "artifactor.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "artifactor.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
