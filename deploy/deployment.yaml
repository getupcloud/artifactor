apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactor
  namespace: artifactor
  labels:
    app: artifactor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifactor
  template:
    metadata:
      labels:
        app: artifactor
    spec:
      serviceAccountName: artifactor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: artifactor-docker-image-token
      containers:
        - name: scanner
          image: ghcr.io/getupcloud/artifactor:0.0.4 # build with `make docker-build` and set your tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_DIR
              value: /data/db
            - name: SCAN_INTERVAL
              value: 6h
            - name: CONCURRENCY
              value: "3"
            # skip the EC2 IMDS fallback when no IRSA/web-identity creds
            # exist: fail fast instead of timing out on the metadata service
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data # writable dir for the grype vulnerability DB and scan temp files
      volumes:
        - name: data
          emptyDir: {}
