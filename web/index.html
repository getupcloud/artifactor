<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifactor</title>
<style>
:root {
  --bg: #0f141a; --panel: #161d26; --panel2: #1c2530; --border: #2a3644;
  --text: #dbe4ee; --muted: #8b98a8; --accent: #4f9cf9;
  --critical: #e5484d; --high: #f76b15; --medium: #ffb224; --low: #f7d447;
  --negligible: #6e7b8a; --unknown: #4a5560;
  --ok: #46a758; --err: #e5484d; --run: #4f9cf9;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--muted);
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.scanned { background: var(--ok); }
.dot.scanning { background: var(--run); animation: pulse 1.2s infinite; }
.dot.error { background: var(--err); }
.dot.queued { background: var(--muted); }
@keyframes pulse { 50% { opacity: .3; } }
button {
  background: var(--accent); color: #fff; border: 0; border-radius: 6px;
  padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
}
button:disabled { opacity: .5; cursor: not-allowed; }
button.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--text); font-weight: 400; }
.banner {
  margin: 12px 18px 0; padding: 10px 14px; border-radius: 8px; font-size: 13px;
  background: rgba(229,72,77,.12); border: 1px solid rgba(229,72,77,.4); color: #ffb3b5;
  display: none; white-space: pre-wrap; word-break: break-word;
}
.banner.show { display: block; }
.banner.info { background: rgba(79,156,249,.12); border-color: rgba(79,156,249,.4); color: #a8cfff; }
.stats {
  display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 18px 0;
}
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 14px; min-width: 90px;
}
.stat .n { font-size: 20px; font-weight: 700; }
.stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.stat.sev, .stat.status { cursor: pointer; user-select: none; border-color: transparent; }
.stat.off { opacity: .35; }
.stat-divider { width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; }
.stat.sev .n.critical { color: var(--critical); }
.stat.sev .n.high { color: var(--high); }
.stat.sev .n.medium { color: var(--medium); }
.stat.sev .n.low { color: var(--low); }
.stat.sev .n.negligible { color: var(--negligible); }
.stat.sev .n.unknown { color: var(--unknown); }
.layout { display: flex; gap: 14px; padding: 14px 18px; align-items: flex-start; }
.sidebar {
  width: 300px; flex: 0 0 300px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden; position: sticky; top: 64px;
}
.sidebar .head {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.sidebar input[type=search] {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px;
}
.imglist { max-height: calc(100vh - 220px); overflow-y: auto; }
.imgrow {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  cursor: pointer; border-bottom: 1px solid rgba(42,54,68,.5); font-size: 12.5px;
  word-break: break-all;
}
.imgrow:hover { background: var(--panel2); }
.imgrow.active { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
.imgrow .name { flex: 1; }
.imgrow .count { color: var(--muted); font-size: 11px; }
.imgrow .err { color: var(--err); }
.content { flex: 1; min-width: 0; }
.filters {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 12px;
}
.filters label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.filters label.cb {
  flex-direction: row; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text); cursor: pointer;
  padding-bottom: 7px;
}
.filters select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 10px; font-size: 13px; width: 200px;
}
#named-vuln-filter { width: 260px; }
.filters input[type=text], .filters input[type=search] {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 10px; font-size: 13px; width: 230px;
}
.filters .hint { font-size: 12px; color: var(--muted); }
.tablewrap {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(42,54,68,.5); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
tr:hover td { background: var(--panel2); }
tr.cve-row { cursor: pointer; }
td.chev { width: 24px; color: var(--muted); text-align: center; user-select: none; }
tr.expand-row td { background: var(--bg); padding: 14px 18px; }
tr.expand-row:hover td { background: var(--bg); }
.exp-body { max-width: 920px; }
.exp-imgs-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.exp-label { color: var(--muted); font-size: 12px; }
.exp-imgs { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin-bottom: 10px; }
.img-tag {
  display: flex; flex-direction: column; gap: 2px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.img-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.img-meta { color: var(--muted); font-size: 10.5px; }
.img-tag:hover { border-color: var(--accent); color: var(--accent); }
.img-tag.current { border-color: var(--accent); color: var(--accent); }
.copy-btn {
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  border-radius: 4px; padding: 1px 8px; font-size: 11px; cursor: pointer;
}
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.exp-desc { color: var(--text); white-space: pre-wrap; }
.exp-urls { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; word-break: break-all; }
.badge {
  display: inline-block; border-radius: 4px; padding: 1px 8px;
  font-size: 11px; font-weight: 700; color: #0f141a;
}
.badge.critical { background: var(--critical); }
.badge.high { background: var(--high); }
.badge.medium { background: var(--medium); }
.badge.low { background: var(--low); }
.badge.negligible { background: var(--negligible); color: #dfe6ee; }
.badge.unknown { background: var(--unknown); color: #dfe6ee; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.pkgname { font-weight: 600; }
.desc { color: var(--muted); max-width: 420px; }
.fixed { color: var(--ok); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.count-note { padding: 10px 12px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Artifactor</h1>
  <span class="chip" id="mode-chip">…</span>
  <span class="chip" id="db-chip">db: …</span>
  <span class="chip" id="last-chip">last scan: never</span>
  <span class="spacer"></span>
  <button class="secondary" id="export-btn" title="Download this report as a single self-contained HTML file">Export</button>
  <button id="scan-btn" title="Scan every image in the cluster">Scan now</button>
</header>

<div class="banner" id="banner"></div>

<div class="stats" id="stats">
  <div class="stat"><div class="n" id="stat-images">0</div><div class="l">Images</div></div>
  <div class="stat status" data-status="scanned" title="Show/hide scanned images"><div class="n" id="stat-scanned">0</div><div class="l">Scanned</div></div>
  <div class="stat status" data-status="error" title="Show/hide images with errors"><div class="n" id="stat-errors">0</div><div class="l">Errors</div></div>
  <div class="stat status" data-status="scanning" title="Show/hide images being scanned"><div class="n" id="stat-scanning">0</div><div class="l">Scanning</div></div>
  <div class="stat"><div class="n" id="stat-cves">0</div><div class="l">Total CVEs</div></div>
  <div class="stat-divider"></div>
  <div class="stat sev" data-sev="critical"><div class="n critical" id="stat-critical">0</div><div class="l">Critical</div></div>
  <div class="stat sev" data-sev="high"><div class="n high" id="stat-high">0</div><div class="l">High</div></div>
  <div class="stat sev" data-sev="medium"><div class="n medium" id="stat-medium">0</div><div class="l">Medium</div></div>
  <div class="stat sev" data-sev="low"><div class="n low" id="stat-low">0</div><div class="l">Low</div></div>
  <div class="stat sev" data-sev="negligible"><div class="n negligible" id="stat-negligible">0</div><div class="l">Negligible</div></div>
  <div class="stat sev" data-sev="unknown"><div class="n unknown" id="stat-unknown">0</div><div class="l">Unknown</div></div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="head">
      <input type="search" id="img-search" placeholder="Filter images…">
    </div>
    <div class="imglist" id="imglist"></div>
  </aside>

  <main class="content">
    <div class="filters">
      <label>Artifact (syft package)
        <input type="search" id="artifact-filter" list="artifact-list" placeholder="e.g. openssl, libc…">
        <datalist id="artifact-list"></datalist>
      </label>
      <label title="Multiple IDs separated by spaces match any of them">CVE IDs
        <input type="text" id="cve-filter" placeholder="e.g. CVE-2024-… CVE-2025-…">
      </label>
      <label title="Well-known vulnerability families">Named vulnerabilities
        <select id="named-vuln-filter">
          <option value="">None</option>
        </select>
      </label>
      <label class="cb" title="Show only CVEs that have a fixed version available">
        <input type="checkbox" id="fixed-filter">
        Only CVEs with fix
      </label>
      <label class="ns" title="Show only CVEs affecting workloads in this namespace">
        Namespace
        <select id="namespace-filter">
          <option value="">All namespaces</option>
        </select>
      </label>
      <button class="secondary" id="clear-btn">Clear filters</button>
      <span class="hint" id="cve-count"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th></th><th>CVE</th><th>Severity</th><th>Package</th><th>Version</th>
            <th>Fixed in</th><th id="th-image">Image</th><th>Matcher</th>
          </tr>
        </thead>
        <tbody id="cve-tbody"></tbody>
      </table>
      <div class="empty" id="empty-msg">Click "Scan now" to scan the cluster images.</div>
    </div>
  </main>
</div>

<!-- EXPORT_DATA -->
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SEVS = ["critical", "high", "medium", "low", "negligible", "unknown"];

// Self-contained export mode: the server (or --export) replaces the marker
// above with a <script id="__artifactor_data" type="application/json"> block
// containing a frozen snapshot of the results. When present, all API calls
// are answered from this snapshot, so the report works without the server.
const SNAPSHOT = (() => {
  const el = document.getElementById("__artifactor_data");
  return el ? JSON.parse(el.textContent) : null;
})();

function snapshotFilterCVEs(params) {
  const image = params.get("image") || "";
  const namespace = params.get("namespace") || "";
  const artifact = (params.get("artifact") || "").toLowerCase();
  // multiple CVE IDs separated by spaces: match when any token is contained
  // (named vulnerability groups are expanded client-side into these tokens)
  const idTokens = (params.get("id") || "").toLowerCase().split(/\s+/).filter(Boolean);
  const sevs = (params.get("severity") || "").split(",").map((s) => s.trim()).filter(Boolean);
  const excluded = (params.get("exclude") || "").split(",").map((s) => s.trim()).filter(Boolean);
  const fixedOnly = params.get("fixed") === "1";
  const rows = (SNAPSHOT.cves || []).filter((c) =>
    (!image || c.image === image) &&
    (!namespace || (c.images || []).some((ref) => ref.image === c.image && ref.namespace === namespace)) &&
    (!artifact || (c.package || "").toLowerCase().includes(artifact)) &&
    (!idTokens.length || idTokens.some((t) => (c.id || "").toLowerCase().includes(t))) &&
    (!sevs.length || sevs.includes(c.severity)) &&
    (!excluded.length || !excluded.includes(c.severity)) &&
    (!fixedOnly || (c.fixedIn && c.fixedIn.length > 0))
  );
  const rank = Object.fromEntries(SEVS.map((s, i) => [s, i]));
  rows.sort((a, b) =>
    rank[a.severity] - rank[b.severity] ||
    (a.package || "").localeCompare(b.package || "") ||
    (a.id || "").localeCompare(b.id || ""));
  return rows;
}

function snapshotAPI(path) {
  const url = new URL(path, "http://localhost");
  switch (url.pathname) {
    case "/api/status":
      return Promise.resolve(SNAPSHOT.status || {});
    case "/api/images":
      return Promise.resolve(SNAPSHOT.images || []);
    case "/api/cves":
      return Promise.resolve(snapshotFilterCVEs(url.searchParams));
    case "/api/namespaces":
      return Promise.resolve(SNAPSHOT.namespaces || []);
    case "/api/named-vulns":
      return Promise.resolve(SNAPSHOT.namedVulns || []);
    case "/api/artifacts": {
      const image = url.searchParams.get("image") || "";
      const q = (url.searchParams.get("q") || "").toLowerCase();
      const names = image && SNAPSHOT.artifactsByImage && SNAPSHOT.artifactsByImage[image]
        ? SNAPSHOT.artifactsByImage[image]
        : (SNAPSHOT.artifacts || []);
      return Promise.resolve(names.filter((n) => !q || n.toLowerCase().includes(q)));
    }
    default:
      return Promise.reject(new Error("not available in exported snapshot: " + path));
  }
}

const state = {
  images: [],          // /api/images summaries
  selected: "",        // "" = all images
  namedGroups: [],     // named vulnerability groups (from web/names.json)
  sevFilter: new Set(),// severities turned OFF (chips start all "on")
  statusFilter: new Set(), // image statuses hidden from the list (chips start all "on")
  status: null,
  imageSearch: "",
  lastQuery: null,     // /api/cves query string of the last render
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path) {
  if (SNAPSHOT) return snapshotAPI(path);
  const res = await fetch(path);
  if (!res.ok) throw new Error(path + " -> HTTP " + res.status);
  return res.json();
}

/* ---------- status / stats ---------- */

async function refreshStatus() {
  try {
    state.status = await api("/api/status");
    $("mode-chip").textContent = state.status.mode || "unknown";
    const db = state.status.db || {};
    $("db-chip").textContent = "db: " + (db.schemaVersion ? "v" + db.schemaVersion : "n/a")
      + (db.built ? " (built " + db.built.slice(0, 10) + ")" : "")
      + (db.error ? " — ERROR" : "");
    $("last-chip").textContent = "last scan: " + (state.status.lastScanDone
      ? new Date(state.status.lastScanDone).toLocaleString() : "never")
      + (state.status.scanning ? " — scanning…" : "");
    const banner = $("banner");
    if (!SNAPSHOT) {
      const problems = [];
      if (state.status.k8sError) problems.push("Kubernetes: " + state.status.k8sError);
      if (db.error) problems.push("Vulnerability DB: " + db.error);
      if (problems.length) { banner.textContent = problems.join("\n"); banner.classList.add("show"); }
      else banner.classList.remove("show");
    }
    $("scan-btn").disabled = state.status.scanning;
  } catch (e) { /* server restarting */ }
}

async function refreshImages() {
  state.images = await api("/api/images");
  let scanned = 0, errors = 0, scanning = 0, cves = 0;
  const sev = Object.fromEntries(SEVS.map((s) => [s, 0]));
  for (const img of state.images) {
    if (img.status === "scanned") scanned++;
    if (img.status === "error") errors++;
    if (img.status === "scanning") scanning++;
    cves += img.cveCount || 0;
    for (const s of SEVS) sev[s] += (img.severities || {})[s] || 0;
  }
  $("stat-images").textContent = state.images.length;
  $("stat-scanned").textContent = scanned;
  $("stat-errors").textContent = errors;
  $("stat-scanning").textContent = scanning;
  $("stat-cves").textContent = cves;
  for (const s of SEVS) $("stat-" + s).textContent = sev[s];
  renderImageList();
}

function renderImageList() {
  const q = state.imageSearch.toLowerCase();
  const visible = state.images.filter((img) => !state.statusFilter.has(img.status));
  const list = $("imglist");
  list.innerHTML = "";
  const allRow = document.createElement("div");
  allRow.className = "imgrow" + (state.selected === "" ? " active" : "");
  allRow.innerHTML = '<span class="dot queued"></span><span class="name">All images</span><span class="count">' + visible.length + "</span>";
  allRow.onclick = () => { state.selected = ""; renderImageList(); loadCVEs(); loadArtifacts(); };
  list.appendChild(allRow);
  for (const img of visible) {
    if (q && !img.image.toLowerCase().includes(q)) continue;
    const row = document.createElement("div");
    row.className = "imgrow" + (state.selected === img.image ? " active" : "");
    const dot = '<span class="dot ' + img.status + '"></span>';
    const badge = img.status === "scanned"
      ? '<span class="count">' + img.cveCount + " CVEs</span>"
      : img.status === "error" ? '<span class="err">error</span>' : '<span class="count">…</span>';
    row.innerHTML = dot + '<span class="name">' + esc(img.image) + "</span>" + badge;
    row.onclick = () => { state.selected = img.image; renderImageList(); loadCVEs(); loadArtifacts(); };
    list.appendChild(row);
  }
}

/* ---------- CVE table ---------- */

async function loadCVEs() {
  const params = new URLSearchParams();
  if (state.selected) params.set("image", state.selected);
  const artifact = $("artifact-filter").value.trim();
  if (artifact) params.set("artifact", artifact);
  // CVE IDs from the text field plus the selected named vulnerability group
  // (expanded client-side, OR-combined)
  const cveIds = $("cve-filter").value.trim().split(/\s+/).filter(Boolean);
  const namedKey = $("named-vuln-filter").value;
  if (namedKey) {
    const group = state.namedGroups.find((g) => g.key === namedKey);
    if (group) cveIds.push(...(group.cves || []));
  }
  if (cveIds.length) params.set("id", cveIds.join(" "));
  const ns = $("namespace-filter").value;
  if (ns) params.set("namespace", ns);
  if ($("fixed-filter").checked) params.set("fixed", "1");
  // chips start all "on"; clicking one turns that severity OFF (excluded)
  if (state.sevFilter.size) params.set("exclude", [...state.sevFilter].join(","));

  let rows;
  const query = params.toString();
  try { rows = await api("/api/cves?" + query); }
  catch { return; }

  // A changed query means the user changed a filter: forget open expansions.
  // Background refreshes reuse the same query and keep them open.
  if (query !== state.lastQuery) {
    expanded.clear();
    state.lastQuery = query;
  }

  const tbody = $("cve-tbody");
  tbody.innerHTML = "";
  $("empty-msg").style.display = rows.length ? "none" : "block";
  $("empty-msg").textContent = rows.length === 0 ? "No CVEs match the current filters." : "";
  $("cve-count").textContent = rows.length + " CVE(s)";
  $("th-image").style.display = state.selected ? "none" : "";

  const trByKey = new Map();
  for (const c of rows) {
    const tr = document.createElement("tr");
    tr.className = "cve-row";
    tr.onclick = () => toggleExpansion(tr, c);
    const idCell = c.dataSource
      ? '<a class="mono" href="' + esc(c.dataSource) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + esc(c.id) + "</a>"
      : '<span class="mono">' + esc(c.id) + "</span>";
    const fixed = (c.fixedIn || []).slice(0, 3).map(esc).join(", ");
    tr.innerHTML =
      '<td class="chev">▸</td>' +
      "<td>" + idCell + "</td>" +
      '<td><span class="badge ' + esc(c.severity) + '">' + esc(c.severity) + "</span></td>" +
      '<td><span class="pkgname">' + esc(c.package) + '</span> <span class="desc">(' + esc(c.packageType) + ")</span></td>" +
      '<td class="mono">' + esc(c.packageVersion) + "</td>" +
      '<td class="fixed mono">' + (fixed || "—") + "</td>" +
      (state.selected ? "" : '<td class="mono">' + esc(c.image) + "</td>") +
      "<td>" + esc(c.matcher) + "</td>";
    trByKey.set(rowKey(c), tr);
    tbody.appendChild(tr);
  }
  // re-open rows that were expanded before this (re)render
  for (const c of rows) {
    const key = rowKey(c);
    const tr = trByKey.get(key);
    if (tr && expanded.has(key)) {
      toggleExpansion(tr, c);
    }
  }
}

// copyText writes to the clipboard, falling back to a hidden textarea +
// execCommand for non-secure contexts (e.g. plain http hosts behind
// port-forward).
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* fall through to the legacy path */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch {
    return false;
  }
}

// rowKey identifies a CVE row across table re-renders, so open expansions
// survive the periodic background refresh.
const rowKey = (c) => c.image + "\x00" + c.id + "\x00" + c.package;
const expanded = new Set();

// toggleExpansion shows, in a row inserted right below the clicked CVE row:
// the vertical list of images containing the CVE (namespace + controller),
// the full description, and reference URLs. Clicking an image tag selects
// that image in the sidebar.
function toggleExpansion(tr, c) {
  const existing = tr.nextElementSibling;
  const key = rowKey(c);
  if (existing && existing.classList.contains("expand-row")) {
    existing.remove();
    tr.querySelector(".chev").textContent = "▸";
    expanded.delete(key);
    return;
  }
  expanded.add(key);
  const colspan = document.querySelectorAll("thead th").length;
  const urls = (c.urls || []).filter((u) => u !== c.dataSource);
  const images = c.images || [];
  const er = document.createElement("tr");
  er.className = "expand-row";
  er.innerHTML = '<td colspan="' + colspan + '"></td>';
  er.firstElementChild.innerHTML =
    '<div class="exp-body">' +
    '<div class="exp-imgs-head"><span class="exp-label">Images containing this CVE:</span>' +
    '<button class="copy-btn" title="Copy the image list (with namespace/controller) to the clipboard">Copy</button></div>' +
    '<div class="exp-imgs">' +
    images.map((ref) =>
      '<span class="img-tag' + (ref.image === c.image ? " current" : "") + '" title="' + esc(ref.image) + '">' +
      '<span class="img-name">' + esc(ref.image) + "</span>" +
      (ref.namespace
        ? '<span class="img-meta">' + esc(ref.namespace) + " · " + esc(ref.controller) + "</span>"
        : "") +
      "</span>"
    ).join("") + "</div>" +
    '<div class="exp-desc">' + esc(c.description || "No description available.") + "</div>" +
    (urls.length
      ? '<div class="exp-urls">' + urls.slice(0, 5).map((u) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + "</a>").join(" ") + "</div>"
      : "") +
    "</div>";
  er.querySelectorAll(".img-tag").forEach((tag) => {
    tag.onclick = (ev) => {
      ev.stopPropagation();
      state.selected = tag.querySelector(".img-name").textContent;
      renderImageList();
      loadCVEs();
      loadArtifacts();
    };
  });
  const copyBtn = er.querySelector(".copy-btn");
  copyBtn.onclick = async (ev) => {
    ev.stopPropagation();
    // one line per workload instance: "namespace/controller — image"
    const text = images.map((ref) =>
      (ref.namespace ? ref.namespace + "/" + ref.controller + " — " : "") + ref.image
    ).join("\n");
    const ok = await copyText(text);
    copyBtn.textContent = ok ? "Copied!" : "Copy failed";
    setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
  };
  tr.insertAdjacentElement("afterend", er);
  tr.querySelector(".chev").textContent = "▾";
}

/* ---------- artifact suggestions (syft package names) ---------- */

async function loadArtifacts() {
  try {
    const params = new URLSearchParams();
    if (state.selected) params.set("image", state.selected);
    const q = $("artifact-filter").value.trim();
    if (q) params.set("q", q);
    const names = await api("/api/artifacts?" + params.toString());
    const dl = $("artifact-list");
    dl.innerHTML = "";
    for (const n of names.slice(0, 300)) {
      const opt = document.createElement("option");
      opt.value = n;
      dl.appendChild(opt);
    }
  } catch { /* ignore */ }
}

/* ---------- actions ---------- */

$("scan-btn").onclick = async () => {
  try { await fetch("/api/scan", { method: "POST" }); }
  catch { /* server restarting */ }
  refreshStatus();
};

$("export-btn").onclick = () => { window.location.href = "/api/export"; };

$("img-search").oninput = () => { state.imageSearch = $("img-search").value; renderImageList(); };

let debounce;
$("artifact-filter").oninput = () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { loadCVEs(); loadArtifacts(); }, 250);
};
$("cve-filter").oninput = () => { clearTimeout(debounce); debounce = setTimeout(loadCVEs, 250); };
$("fixed-filter").onchange = loadCVEs;
$("namespace-filter").onchange = loadCVEs;
$("named-vuln-filter").onchange = loadCVEs;

for (const el of document.querySelectorAll(".stat.sev")) {
  el.onclick = () => {
    const sev = el.dataset.sev;
    if (state.sevFilter.has(sev)) state.sevFilter.delete(sev);
    else state.sevFilter.add(sev);
    el.classList.toggle("off", state.sevFilter.has(sev));
    loadCVEs();
  };
}

// Scanned / Errors / Scanning chips toggle the visibility of those image
// statuses in the sidebar list (all start "on").
for (const el of document.querySelectorAll(".stat.status")) {
  el.onclick = () => {
    const status = el.dataset.status;
    if (state.statusFilter.has(status)) state.statusFilter.delete(status);
    else state.statusFilter.add(status);
    el.classList.toggle("off", state.statusFilter.has(status));
    renderImageList();
  };
}

$("clear-btn").onclick = () => {
  $("artifact-filter").value = "";
  $("cve-filter").value = "";
  $("fixed-filter").checked = false;
  $("namespace-filter").value = "";
  $("named-vuln-filter").value = "";
  state.sevFilter.clear();
  document.querySelectorAll(".stat.sev").forEach((el) => el.classList.remove("off"));
  state.statusFilter.clear();
  document.querySelectorAll(".stat.status").forEach((el) => el.classList.remove("off"));
  renderImageList();
  loadCVEs();
  loadArtifacts();
};

/* ---------- named vulnerabilities selector ---------- */

// The process fetches the names.json file from the GitHub repository at
// startup (10s timeout) and falls back to the embedded copy; the SPA just
// reads the list served by the API (or the export snapshot).
async function loadNamedVulns() {
  let groups;
  try { groups = await api("/api/named-vulns"); }
  catch { return; }
  if (!groups || !Array.isArray(groups) || groups.length === 0) return;
  state.namedGroups = groups.map((g) => ({
    key: String(g.name || "").toLowerCase().replace(/[^a-z0-9]+/g, ""),
    name: g.name,
    cves: g.cves || [],
  }));
  const sel = $("named-vuln-filter");
  const current = sel.value;
  sel.innerHTML = '<option value="">None</option>';
  for (const g of state.namedGroups) {
    const opt = document.createElement("option");
    opt.value = g.key;
    opt.textContent = g.name + ": " + g.cves.join(", ");
    sel.appendChild(opt);
  }
  sel.value = state.namedGroups.some((g) => g.key === current) ? current : "";
}

/* ---------- namespace selector ---------- */

let lastNamespacesKey = null;
async function loadNamespaces() {
  let namespaces;
  try { namespaces = await api("/api/namespaces"); }
  catch { return; }
  const key = namespaces.join(",");
  if (key === lastNamespacesKey) return; // nothing changed, keep selection
  lastNamespacesKey = key;
  const sel = $("namespace-filter");
  const current = sel.value;
  sel.innerHTML = '<option value="">All namespaces</option>';
  for (const ns of namespaces) {
    const opt = document.createElement("option");
    opt.value = ns;
    opt.textContent = ns;
    sel.appendChild(opt);
  }
  sel.value = namespaces.includes(current) ? current : "";
}

/* ---------- polling ---------- */

async function poll() {
  await refreshStatus();
  await refreshImages().catch(() => {});
  loadNamespaces().catch(() => {});
  loadCVEs().catch(() => {});
  if (state.status && state.status.scanning) loadArtifacts().catch(() => {});
}

if (SNAPSHOT) {
  // frozen export: no live actions, no polling
  $("scan-btn").style.display = "none";
  $("export-btn").style.display = "none";
  const banner = $("banner");
  banner.textContent = "Snapshot report exported at " +
    new Date(SNAPSHOT.generatedAt).toLocaleString() +
    " — data is frozen; all filters work offline.";
  banner.classList.add("show", "info");
}

poll();
loadArtifacts();
loadNamedVulns();
loadNamespaces().catch(() => {});
if (!SNAPSHOT) setInterval(poll, 8000);
</script>
</body>
</html>
